id = "brachkow.workspace-ports"
name = "Workspace Ports"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Show TCP ports listened on by each workspace in the sidebar"
# Needs lsof and ps
platforms = ["macos", "linux"]

# Herdr checks out the whole repository, so this installs from the workspace root lockfile
[[build]]
command = ["pnpm", "install", "--frozen-lockfile", "--filter", "."]

[[build]]
command = ["pnpm", "build"]

# Herdr has no event for "a process started listening", so the startup process
# stays alive and polls. It exits by itself once the Herdr server is gone.
[[startup]]
command = ["node", "dist/index.mjs"]

[[actions]]
id = "restart"
title = "Workspace Ports: restart"
description = "Start a fresh poller in place of the running one"
contexts = ["global"]
command = ["node", "dist/index.mjs"]

[[actions]]
id = "refresh"
title = "Workspace Ports: refresh once"
contexts = ["global"]
command = ["node", "dist/index.mjs", "--once"]
